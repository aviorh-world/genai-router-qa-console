          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/conversations/average-user-messages:
    post:
      tags:
      - Statistics
      summary: Get average user messages per conversation
      operationId: getAverageUserMessagesPerConversation
      requestBody:
        $ref: "#/components/requestBodies/StatisticsDateRange"
      responses:
        "200":
          description: Average user messages per conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AverageUserMessagesResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/conversations/user-message-buckets:
    post:
      tags:
      - Statistics
      summary: Get conversations grouped by user message count
      operationId: getUserMessageConversationBuckets
      requestBody:
        $ref: "#/components/requestBodies/StatisticsDateRange"
      responses:
        "200":
          description: Conversation counts grouped into user-message buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessageBucketsResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/messages/average-duration:
    post:
      tags:
      - Statistics
      summary: Get average message duration
      operationId: getAverageMessageDuration
      requestBody:
        $ref: "#/components/requestBodies/StatisticsDateRange"
      responses:
        "200":
          description: Average message duration in milliseconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AverageMessageDurationResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/tools/count:

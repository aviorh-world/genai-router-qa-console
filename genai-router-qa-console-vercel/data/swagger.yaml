openapi: 3.0.3
info:
  title: Chat API
  version: 1.0.6
servers:
- url: https://virtserver.swaggerhub.com/ofir-kpmg/Router/1.0.6
  description: SwaggerHub API Auto Mocking
tags:
- name: Health
- name: Conversations
- name: Messages
- name: Feedback
- name: Statistics
- name: Files
paths:
  /health:
    get:
      tags:
      - Health
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/files/download:
    post:
      tags:
      - Files
      summary: Download a file from storage
      operationId: downloadFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDownloadRequest"
        required: true
      responses:
        "200":
          description: File content streamed as an attachment
          headers:
            Content-Disposition:
              description: Attachment disposition with ASCII and UTF-8 file names
              schema:
                type: string
            Content-Length:
              description: "File size in bytes, when known"
              schema:
                minimum: 0
                type: integer
                format: int64
            Content-Encoding:
              description: "Storage content encoding, when present and safe to forward"
              schema:
                type: string
            Cache-Control:
              description: Cache policy for the downloaded file
              schema:
                type: string
                example: "private, no-store"
            X-Content-Type-Options:
              description: Prevents MIME type sniffing
              schema:
                type: string
                enum:
                - nosniff
            X-Accel-Buffering:
              description: Disables proxy response buffering
              schema:
                type: string
                enum:
                - "no"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid bucket or file name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: File download is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: File was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          description: Failed to prepare the file download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to communicate with file storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: File downloads are not configured or file storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/new:
    post:
      tags:
      - Conversations
      summary: Create new conversation
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              required:
              - appId
              - userId
              type: object
              properties:
                appId:
                  maxLength: 50
                  minLength: 1
                  pattern: "^[^{}\\\\]*$"
                  type: string
                  description: Which App initiate call to the Router API
                  example: Desktop
                userId:
                  maxLength: 128
                  minLength: 1
                  type: string
                  description: Which user initiated the request
                  format: email
                  example: user@example.com
                caseId:
                  maxLength: 9
                  minLength: 9
                  pattern: "^\\d{9}$"
                  type: string
                  description: case Id relevant for the context of the conversation
                  nullable: true
                  example: "123456789"
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                required:
                - appId
                - caseId
                - conversationId
                - userId
                type: object
                properties:
                  conversationId:
                    maxLength: 36
                    minLength: 36
                    type: string
                    format: uuid
                  appId:
                    maxLength: 50
                    minLength: 1
                    pattern: "^[^{}\\\\]*$"
                    type: string
                    description: Which App initiate call to the Router API
                    example: Desktop
                  userId:
                    maxLength: 128
                    minLength: 1
                    type: string
                    description: Which user initiated the request
                    format: email
                    example: user@example.com
                  caseId:
                    maxLength: 9
                    minLength: 9
                    pattern: "^\\d{9}$"
                    type: string
                    description: case Id relevant for the context of the conversation
                    nullable: true
                    example: "123456789"
                additionalProperties: false
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/history:
    post:
      tags:
      - Conversations
      summary: Get conversations history by user (can be granular by case)
      operationId: getConversationHistory
      requestBody:
        content:
          application/json:
            schema:
              required:
              - appId
              - userId
              type: object
              properties:
                appId:
                  maxLength: 50
                  minLength: 1
                  pattern: "^[^{}\\\\]*$"
                  type: string
                  description: Which App initiate call to the Router API
                  example: Desktop
                userId:
                  maxLength: 128
                  minLength: 1
                  type: string
                  description: Which user initiated the request
                  format: email
                  example: user@example.com
                caseId:
                  maxLength: 9
                  minLength: 9
                  pattern: "^\\d{9}$"
                  type: string
                  description: case Id relevant for the context of the conversation. If null gets all history of user
                  nullable: true
                  example: "123456789"
                limit:
                  maximum: 100
                  minimum: 1
                  type: integer
                  description: How many results to return
                  example: 20
                  default: 20
                offset:
                  maximum: 100
                  minimum: 0
                  type: integer
                  description: From which result start fetching history
                  example: 0
                  default: 0
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                required:
                - conversations
                type: object
                properties:
                  conversations:
                    maxItems: 100
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationHistoryItem"
                additionalProperties: false
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/id:
    post:
      tags:
      - Conversations
      summary: Get single conversation with messages
      operationId: getConversation
      requestBody:
        content:
          application/json:
            schema:
              required:
              - conversationId
              - userId
              type: object
              properties:
                conversationId:
                  maxLength: 36
                  minLength: 36
                  type: string
                  description: unique identifier of a conversation"
                  format: uuid
                userId:
                  maxLength: 128
                  minLength: 1
                  type: string
                  description: Which user initiated the request
                  format: email
                  example: user@example.com
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Full conversation
          content:
            application/json:
              schema:
                required:
                - conversation
                - messages
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                additionalProperties: false
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User sent is different than user conversation is associated with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
      - Conversations
      summary: delete single conversation
      operationId: deleteConversation
      requestBody:
        content:
          application/json:
            schema:
              required:
              - conversationId
              - userId
              type: object
              properties:
                conversationId:
                  maxLength: 36
                  minLength: 36
                  type: string
                  description: unique identifier of a conversation"
                  format: uuid
                userId:
                  maxLength: 128
                  minLength: 1
                  type: string
                  description: Which user initiated the request
                  format: email
                  example: user@example.com
              additionalProperties: false
        required: true
      responses:
        "200":
          description: deletion successful
          content:
            application/json:
              schema:
                required:
                - conversationId
                type: object
                properties:
                  conversationId:
                    maxLength: 36
                    minLength: 36
                    type: string
                    format: uuid
                additionalProperties: false
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User sent is different than user conversation is associated with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/messages:
    post:
      tags:
      - Messages
      summary: Send message and stream assistant response
      operationId: sendMessageStreaming
      requestBody:
        content:
          application/json:
            schema:
              required:
              - appId
              - content
              - conversationId
              - userId
              type: object
              properties:
                conversationId:
                  maxLength: 36
                  minLength: 36
                  type: string
                  description: unique identifier of a conversation"
                  format: uuid
                userId:
                  maxLength: 128
                  minLength: 1
                  type: string
                  description: Which user initiated the request
                  format: email
                  example: user@example.com
                appId:
                  maxLength: 50
                  minLength: 1
                  pattern: "^[^{}\\\\]*$"
                  type: string
                  description: Which App initiate call to the Router API
                  example: Desktop
                caseId:
                  maxLength: 9
                  minLength: 9
                  pattern: "^\\d{9}$"
                  type: string
                  description: case Id relevant for the context of the conversation. If null gets all history of user
                  nullable: true
                  example: "123456789"
                content:
                  maxLength: 32768
                  minLength: 1
                  pattern: "^[^{}\\\\]*$"
                  type: string
                  example: What is decision 2233 about?
              additionalProperties: false
        required: true
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type": "messageId", "id": "uuid"}

                  data: {"type": "content", "text":"response from LLM"}

                  data: {  "type": "artifact",  "presentation": { "format": "table" },  "data": { "headers": [ "SHM_TIK","SHM_COD_190_191","SHM_SHNAT_MAS","SHM_MAS_MEGIA"],"rows": [ [272798059,190, 2024,154749912],[875472326,191,2024,48414419],[87901948,190,2024,29309975]]}}

                  data: {"type": "tool", "text": "Using Q&A"}

                  data: {"type": "thought", "text":" trying to compare documents.."}

                  data: { "type": "sources", "content": [
                          {
                              "bucket": "tax_document_execution_insructions_dev",
                              "fileName": "112-ח.מ 17.2018- החוק לצמצום השימוש במזומן.pdf",
                              "title": "חוזר רשות המסים 17/2018 : בנושא החוק לצמצום השימוש במזומן",
                              "chunks": [
                                  11
                              ],
                              "date": "03/12/2018"
                          }
                      ]
                    }

                  data: {"type": "error", "text":"error"}

                  data: {"type": "done"}
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/conversations/fetch/chunks/text:
    post:
      tags:
      - Conversations
      summary: Fetch text for document chunks
      operationId: fetchChunksText
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchChunksTextRequest"
        required: true
      responses:
        "200":
          description: Chunk texts
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  $ref: "#/components/schemas/ChunkText"
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/messages/send/feedback:
    post:
      tags:
      - Feedback
      summary: Send feedback for assistant message
      operationId: sendFeedback
      requestBody:
        content:
          application/json:
            schema:
              required:
              - feedbackType
              - messageId
              type: object
              properties:
                messageId:
                  maxLength: 36
                  minLength: 36
                  type: string
                  format: uuid
                feedbackType:
                  maxLength: 11
                  minLength: 4
                  type: string
                  enum:
                  - thumbs_up
                  - thumbs_down
                  - text
                feedbackText:
                  maxLength: 4000
                  minLength: 1
                  pattern: "^[^{}\\\\]*$"
                  type: string
                  nullable: true
                  example: The answer was inaccurate
              additionalProperties: false
              oneOf:
              - required:
                - feedbackText
                properties:
                  feedbackType:
                    type: string
                    enum:
                    - text
                  feedbackText:
                    maxLength: 4000
                    minLength: 1
                    pattern: "^[^{}\\\\]*$"
                    type: string
              - properties:
                  feedbackType:
                    type: string
                    enum:
                    - thumbs_up
                    - thumbs_down
        required: true
      responses:
        "200":
          description: Feedback stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFeedback"
        "400":
          description: Bad Request - Missing or Bad parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

      responses:
        "200":
          description: Active users in the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveUsersResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/conversations/count:
    post:
      tags:
      - Statistics
      summary: Get conversation count
      operationId: getStatisticsConversationCount
      requestBody:
        $ref: "#/components/requestBodies/StatisticsDateRange"
      responses:
        "200":
          description: Conversation count in the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsCountResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/conversations/count-by-user:
    post:
      tags:
      - Statistics
      summary: Get conversation counts by user
      operationId: getConversationCountsByUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatisticsDateRangeWithOptionalUser"
        required: true
      responses:
        "200":
          description: Conversation counts grouped by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCountByUserResponse"
        "422":
          $ref: "#/components/responses/StatisticsValidationError"
        "500":
          $ref: "#/components/responses/StatisticsInternalError"
  /v1/statistics/messages/user/count:

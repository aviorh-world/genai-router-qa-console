    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
        msg:
          type: string
        type:
          type: string
    Conversation:
      required:
      - appId
      - caseId
      - conversationId
      - createdAt
      - updatedAt
      - userId
      type: object
      properties:
        conversationId:
          maxLength: 36
          minLength: 36
          type: string
          format: uuid
        createdAt:
          maxLength: 64
          minLength: 20
          type: string
          format: date-time
        updatedAt:
          maxLength: 64
          minLength: 20
          type: string
          format: date-time
        userId:
          maxLength: 128
          minLength: 1
          type: string
          format: email
        appId:
          maxLength: 50
          minLength: 1
          pattern: "^[^{}\\\\]*$"
          type: string
        caseId:
          maxLength: 9
          minLength: 9
          pattern: "^\\d{9}$"
          type: string
          nullable: true
      additionalProperties: false
    ConversationHistoryItem:
      required:
      - appId
      - caseId
      - conversationId
      - createdAt
      - title
      - updatedAt
      - userId
      type: object
      properties:
        conversationId:
          maxLength: 36
          minLength: 36
          type: string
          format: uuid
        title:
          maxLength: 256
          minLength: 1
          type: string
          nullable: true
        updatedAt:
          maxLength: 64
          minLength: 20
          type: string
          format: date-time
        createdAt:
          maxLength: 64
          minLength: 20
          type: string
          format: date-time
        userId:
          maxLength: 128
          minLength: 1
          type: string
          format: email
        appId:
          maxLength: 50
          minLength: 1
          pattern: "^[^{}\\\\]*$"
          type: string
        caseId:
          maxLength: 9
          minLength: 9
          pattern: "^\\d{9}$"
          type: string
          nullable: true
      additionalProperties: false
    Error:
      required:
      - code
      - description
      - status
      type: object
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        status:
          maxLength: 64
          minLength: 3
          pattern: "^[A-Z][A-Z0-9_]*$"
          type: string
        description:
          maxLength: 2048
          minLength: 1
          type: string
      additionalProperties: false
    MessageFeedback:
      required:
      - feedbackText
      - feedbackType
      - messageId
      type: object
      properties:
        messageId:
          maxLength: 36
          minLength: 36
          type: string
          format: uuid
        feedbackType:
          maxLength: 11
          minLength: 4
          type: string
          enum:
          - thumbs_up
          - thumbs_down
          - text
        feedbackText:
          maxLength: 4000
          minLength: 1
          pattern: "^[^{}\\\\]*$"
          type: string
          nullable: true
      additionalProperties: false
    FetchChunksTextRequest:
      required:
      - chunks
      type: object
      properties:
        chunks:
          maxItems: 100
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/FetchChunkTextRequestItem"
      additionalProperties: false
    FetchChunkTextRequestItem:
      required:
      - chunkId
      - documentBucket
      - documentFileName
      type: object
      properties:
        documentBucket:
          maxLength: 255
          minLength: 1
          type: string
          description: Document bucket name
          example: bucketName
        documentFileName:
          maxLength: 1024
          minLength: 1
          type: string
          description: Document file name
          example: fileName.pdf
        chunkId:
          maximum: 10000
          minimum: 0
          type: integer
          description: Chunk id to fetch
          example: 1
      additionalProperties: false
    ChunkText:
      required:
      - chunkIndex
      - chunkText
      - documentId
      - found
      type: object
      properties:
        documentId:
          maxLength: 1280
          minLength: 1
          type: string
          description: Full document identifier built as documentBucket/documentFileName
          example: bucketName/fileName.pdf
        chunkIndex:
          maximum: 10000
          minimum: 0
          type: integer
          description: Chunk index returned by the Q&A service
          example: 1
        chunkText:
          maxLength: 8192
          minLength: 0
          type: string
          description: Text content of the chunk
          example: Chunk text
        found:
          type: boolean
          description: Whether the requested chunk was found
          example: true
      additionalProperties: false
    Message:
      required:
      - content
      - createdAt
      - messageId
      - messageIndex
      - role
      - type
      type: object
      properties:
        messageId:
          maxLength: 36
          minLength: 36
          type: string
          format: uuid
        messageIndex:
          maximum: 1000
          minimum: 0
          type: integer
        role:
          maxLength: 9
          minLength: 4
          type: string
          enum:
          - user
          - assistant
          - tool
        type:
          maxLength: 8
          minLength: 4
          type: string
          description: the type of content
          enum:
          - text
          - artifact
          - sources
        content:
          maxLength: 8192
          minLength: 0
          pattern: "^[^{}\\\\]*$"
          type: string
          description: string representation of the data sent by user or assistant
        createdAt:
          maxLength: 64
          minLength: 20
          type: string
          format: date-time
      additionalProperties: false
  responses:
    RequestValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"
    StatisticsValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"
    StatisticsInternalError:
      description: Failed to retrieve statistics
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  requestBodies:
    StatisticsDateRange:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatisticsDateRangeRequest"
      required: true
